<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 12px;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .logo {
      font-weight: bold;
      letter-spacing: 1px;
      color: #4285f4;
    }
    .status-led {
      width: 8px;
      height: 8px;
      background: #00ff00;
      border-radius: 50%;
      box-shadow: 0 0 5px #00ff00;
    }
    .platform-icons {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .platform-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: bold;
      color: white;
    }
    .label {
      font-size: 10px;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    #masterContext {
      width: 100%;
      flex-grow: 1;
      font-size: 11px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px;
      resize: none;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.8;
    }
    .btn-secondary {
      background: #333;
      color: white;
    }
    .btn-primary {
      background: #4285f4;
      color: white;
    }
    .btn-danger {
      background: #d32f2f;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">MiNiGeMi</span>
    <div class="status-led" id="status"></div>
  </div>

  <div class="platform-icons">
    <div class="platform-icon" style="background: #4285f4;" title="Gemini">G</div>
    <div class="platform-icon" style="background: #d97757;" title="Claude">C</div>
    <div class="platform-icon" style="background: #10a37f;" title="GPT">P</div>
  </div>
  
  <label class="label">PASS 1: COLLECTIVE CONTEXT</label>
  <textarea id="masterContext" placeholder="Awaiting data..."></textarea>
  
  <button id="collectBtn" class="btn btn-secondary">COLLECT ALL MESSAGES</button>
  <button id="broadcastBtn" class="btn btn-primary">PASS 2: BROADCAST TO ALL</button>
  <button id="clearBtn" class="btn btn-danger">CLEAR CONTEXT</button>

  <script src="sidebar.js"></script>
</body>
</html>
