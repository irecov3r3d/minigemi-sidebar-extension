<!DOCTYPE html>
<html>
<body style="width: 220px; font-family: 'Segoe UI', sans-serif; padding: 12px; background: #121212; color: #e0e0e0; margin: 0;">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 10px;">
    <span style="font-weight: bold; letter-spacing: 1px; color: #4285f4;">MiNiGeMi</span>
    <div id="status" style="width: 8px; height: 8px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 5px #00ff00;"></div>
  </div>

  <div id="icons" style="display: flex; gap: 8px; margin-bottom: 15px;">
    <div style="width:24px; height:24px; background: #4285f4; border-radius:4px; display: grid; place-items: center; font-size: 10px; font-weight: bold;" title="Gemini">G</div>
    <div style="width:24px; height:24px; background: #d97757; border-radius:4px; display: grid; place-items: center; font-size: 10px; font-weight: bold;" title="Claude">C</div>
    <div style="width:24px; height:24px; background: #10a37f; border-radius:4px; display: grid; place-items: center; font-size: 10px; font-weight: bold;" title="GPT">P</div>
  </div>
  
  <label style="font-size: 10px; color: #888;">PASS 1: COLLECTIVE CONTEXT</label>
  <textarea id="masterContext" placeholder="Awaiting data..." style="width: 100%; height: 180px; font-size: 11px; background: #1e1e1e; color: #fff; border: 1px solid #333; border-radius: 4px; padding: 8px; margin-top: 5px; resize: none;"></textarea>
  
  <button id="collectBtn" style="width: 100%; margin-top: 10px; padding: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">COLLECT ALL MESSAGES</button>
  
  <button id="broadcastBtn" style="width: 100%; margin-top: 8px; padding: 10px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">PASS 2: BROADCAST TO ALL</button>

  <script src="sidebar.js"></script>
</body>
</html>
